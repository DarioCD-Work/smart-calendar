<p-dialog
  header="Ajustes"
  [visible]="visible"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: 'min(480px, calc(100vw - 32px))' }"
  styleClass="category-settings-dialog"
  (visibleChange)="onVisibleChange($event)"
>
  <fieldset class="view-preference">
    <legend>Vista del calendario</legend>
    <div class="view-segments">
      @for (option of viewOptions; track option.value) {
        <label class="view-option" [class.active]="viewMode === option.value">
          <input type="radio" name="calendarViewMode" [value]="option.value"
            [checked]="viewMode === option.value" (change)="viewChanged.emit(option.value)" />
          <span>{{ option.label }}</span>
        </label>
      }
    </div>
  </fieldset>
  <app-weather-settings />
  <h2 class="category-section-title">Colores de categorías</h2>
  <div class="category-settings-list">
    @for (category of categories; track category.id) {
      <div class="category-setting-row">
        <span class="category-current-swatch" [style.backgroundColor]="category.color" aria-hidden="true"></span>
        <div class="category-setting-copy">
          <strong>{{ category.name }}</strong>
          <code>{{ categoryColorCode(category) }}</code>
        </div>
        <label class="category-color-control">
          <span>Color de {{ category.name }}</span>
          <p-colorPicker
            [ngModel]="category.color"
            (ngModelChange)="updateColor(category, $event)"
            format="hex"
            appendTo="body"
            [baseZIndex]="1300"
            [inputId]="'category-color-' + category.id"
            styleClass="category-color-picker"
          />
        </label>
      </div>
    }
  </div>

  <app-backup-settings [visible]="visible" />

  @if (error) {
    <p class="category-settings-error" role="alert">{{ error }}</p>
  }

  <div class="category-settings-actions">
    <p-button label="Cerrar" severity="secondary" [outlined]="true" (onClick)="requestClose()" />
  </div>
</p-dialog>
